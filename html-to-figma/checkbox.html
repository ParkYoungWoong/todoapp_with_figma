<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkbox Component</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard Variable', 'Pretendard', system-ui, sans-serif; }
    .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 20; }

    .section {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .section.light { background: #ffffff; color: #1a1a1a; }
    .section.dark { background: #101822; color: #ffffff; }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.5;
    }

    .variant-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .variant-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .variant-label {
      font-size: 13px;
      width: 120px;
      opacity: 0.6;
    }

    /* Checkbox */
    .checkbox {
      display: flex;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 2px solid;
      transition: all 0.15s;
    }
    .checkbox .material-symbols-rounded {
      font-size: 20px;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }

    /* Light variants */
    .light .checkbox.unchecked {
      border-color: rgba(82, 102, 130, 0.3);
      background: transparent;
    }
    .light .checkbox.checked {
      border-color: #3c94ff;
      background: #3c94ff;
    }
    .light .checkbox.checked .material-symbols-rounded { color: #ffffff; }
    .light .checkbox.indeterminate {
      border-color: rgba(60, 148, 255, 0.5);
      background: rgba(60, 148, 255, 0.3);
    }
    .light .checkbox.indeterminate .material-symbols-rounded { color: #ffffff; }

    /* Dark variants */
    .dark .checkbox.unchecked {
      border-color: rgba(173, 188, 212, 0.3);
      background: transparent;
    }
    .dark .checkbox.checked {
      border-color: #0d6efd;
      background: #0d6efd;
    }
    .dark .checkbox.checked .material-symbols-rounded { color: #ffffff; }
    .dark .checkbox.indeterminate {
      border-color: rgba(13, 110, 253, 0.5);
      background: rgba(13, 110, 253, 0.3);
    }
    .dark .checkbox.indeterminate .material-symbols-rounded { color: #ffffff; }
  </style>
</head>
<body>

  <!-- Light Mode -->
  <div class="section light">
    <div class="section-title">Checkbox / Light</div>
    <div class="variant-group">
      <div class="variant-row">
        <span class="variant-label">Unchecked</span>
        <div class="checkbox unchecked"></div>
      </div>
      <div class="variant-row">
        <span class="variant-label">Checked</span>
        <div class="checkbox checked">
          <span class="material-symbols-rounded">check</span>
        </div>
      </div>
      <div class="variant-row">
        <span class="variant-label">Indeterminate</span>
        <div class="checkbox indeterminate">
          <span class="material-symbols-rounded">remove</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Dark Mode -->
  <div class="section dark">
    <div class="section-title">Checkbox / Dark</div>
    <div class="variant-group">
      <div class="variant-row">
        <span class="variant-label">Unchecked</span>
        <div class="checkbox unchecked"></div>
      </div>
      <div class="variant-row">
        <span class="variant-label">Checked</span>
        <div class="checkbox checked">
          <span class="material-symbols-rounded">check</span>
        </div>
      </div>
      <div class="variant-row">
        <span class="variant-label">Indeterminate</span>
        <div class="checkbox indeterminate">
          <span class="material-symbols-rounded">remove</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
